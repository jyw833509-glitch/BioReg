name: Regulatory Sync
on:
  schedule:
    # Every Monday at 09:17 Asia/Shanghai (01:17 UTC).
    - cron: '17 1 * * 1'
  workflow_dispatch:
    inputs:
      source:
        description: Source
        type: choice
        options: [all, fda, ema, nmpa, cde, ich, pmda, usp, edqm]
        default: all
      mode:
        description: Initial is manual only
        type: choice
        options: [incremental, initial]
        default: incremental
      dry_run:
        description: Read and parse without database writes
        type: boolean
        default: false
      limit:
        description: Maximum documents per source (manual historical backfill, 1-100)
        type: string
        default: '8'
permissions:
  contents: read
concurrency:
  group: regulatory-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || vars.REGULATORY_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      SYNC_SOURCE: ${{ inputs.source || 'all' }}
      SYNC_MODE: ${{ inputs.mode || 'incremental' }}
      SYNC_DRY_RUN: ${{ inputs.dry_run || 'false' }}
      EVENT_NAME: ${{ github.event_name }}
      SYNC_LIMIT: ${{ inputs.limit || '8' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prepare database and source configurations
        if: env.SYNC_DRY_RUN != 'true'
        run: npm run sync:prepare
      - name: Run sequential scheduler
        shell: bash
        run: |
          if ! [[ "$SYNC_LIMIT" =~ ^[0-9]+$ ]] || (( 10#$SYNC_LIMIT < 1 || 10#$SYNC_LIMIT > 100 )); then
            echo 'Invalid sync limit (expected 1-100)'
            exit 1
          fi
          args=("$SYNC_SOURCE" --mode "$SYNC_MODE" --limit "$SYNC_LIMIT")
          if [ "$EVENT_NAME" = schedule ]; then
            args+=(--due --trigger scheduled)
          else
            args+=(--trigger manual)
          fi
          if [ "$SYNC_DRY_RUN" = true ]; then args+=(--dry-run); fi
          set +e
          npm run sync -- "${args[@]}"
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo '::warning::PARTIAL_SUCCESS: see source health summary; successful sources were committed.'
            exit 0
          fi
          exit "$code"
      - name: Save sanitized sync summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regulatory-sync-summary-${{ github.run_id }}
          path: .data/sync-summary.json
          retention-days: 30
          if-no-files-found: ignore
      - uses: actions/setup-python@v5
        if: success() && env.SYNC_DRY_RUN != 'true'
        with:
          python-version: '3.11'
      - name: Apply reviewed Chinese titles with rollback provenance
        if: success() && env.SYNC_DRY_RUN != 'true'
        run: |
          npx tsx scripts/verify-enrichment.ts before
          npx tsx scripts/translate-titles.ts export
          npx tsx scripts/collect-official-chinese-titles.ts
          npx tsx scripts/translate-titles.ts prepare-reviewed
          npx tsx scripts/translate-titles.ts import
          npx tsx scripts/translate-titles.ts export
      - name: Translate new public titles locally
        if: success() && env.SYNC_DRY_RUN != 'true'
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TITLE_REVIEW_LIMIT: '64'
        run: |
          if python -c "import json,sys;sys.exit(0 if any(not r.get('title_zh') for r in json.load(open('.data/title-input.json'))) else 1)"; then
            python -m pip install 'llama-cpp-python==0.3.16' --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
            python -m pip install 'huggingface-hub==0.36.0'
            python scripts/translate-titles.py
            npx tsx scripts/translate-titles.ts prepare-generated
            npx tsx scripts/translate-titles.ts import
            echo 'Candidates that fail quality checks remain pending; never replace official facts.'
          fi
      - uses: actions/cache@v4
        if: success() && env.SYNC_DRY_RUN != 'true'
        with:
          path: .data/official-field-evidence
          key: official-evidence-v1-${{ github.run_id }}
          restore-keys: official-evidence-v1-
      - name: Capture official field evidence
        if: success() && env.SYNC_DRY_RUN != 'true'
        env:
          OFFICIAL_AUDIT_INPUT: .data/title-input.json
        run: |
          python -m pip install 'pypdf[crypto]==6.3.0'
          python scripts/audit-official-fields.py
          npx tsx scripts/enrich-official-fields.ts
          npx tsx scripts/verify-enrichment.ts after
      - name: Save sanitized enrichment summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: field-enrichment-summary
          path: |
            .data/field-enrichment-summary.json
            .data/official-fields-audit.json
            .data/enrichment-integrity-after.json
          retention-days: 30
          if-no-files-found: ignore
      - name: Save translation review candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: title-review-candidates
          path: .data/title-output.json
          retention-days: 7
          if-no-files-found: warn
